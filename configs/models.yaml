    license: "Apache-2.0"
    params_total: "3B (AWQ 4-bit)"
    architecture: "ViT + 4-bit Quantized LM"
    native_grounding_format: "bbox_2d"
    supported_roles: ["inference", "tiling"]
    vram_fp16_weights_mb: 2400
    expected_peak_vram_inference_mb: 4500
