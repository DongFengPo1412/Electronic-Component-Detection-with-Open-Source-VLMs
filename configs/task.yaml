# Task Definition for Electronic-Component-Detection-with-Open-Source-VLMs
task_name: "Electronic-Component-Detection-with-Open-Source-VLMs"
thesis_title_zh: "基于开源视觉语言大模型的电子元器件检测"

task_definition:
  input_type: "已装配印刷电路板（PCB）可见光图像"
  output_type: "电子元器件类别标签及水平矩形边界框坐标 [x1, y1, x2, y2]"
  subsets:
    - name: "Microscope"
      description: "显微镜成像子集，局部高倍率、微距、细小贴片元件"
    - name: "DSLR"
      description: "单反数码相机成像子集，整板/广角视野、多角度光照"

candidate_categories:
  - id: 1
    name: "resistor"
    zh: "电阻"
  - id: 2
    name: "capacitor"
    zh: "电容"
  - id: 3
    name: "inductor"
    zh: "电感"
  - id: 4
    name: "diode"
    zh: "二极管"
  - id: 5
    name: "transistor"
    zh: "晶体管"
  - id: 6
    name: "ic"
    zh: "集成电路芯片"

models:
  primary_train_candidate: "Qwen/Qwen3-VL-2B-Instruct"
  primary_local_fallback: "Qwen/Qwen2.5-VL-3B-Instruct-AWQ"
  comparative_candidate: "deepseek-ai/deepseek-vl2-tiny"

evaluation:
  primary_metrics:
    - "Precision@IoU=0.50"
    - "Recall@IoU=0.50"
    - "F1@IoU=0.50"
    - "Parse_Success_Rate"
  secondary_metrics:
    - "Precision@IoU=0.75"
    - "Recall@IoU=0.75"
    - "F1@IoU=0.75"
    - "Inference_Latency_ms"
    - "Peak_VRAM_MB"
  coco_ap_policy: "若导师或评分明确要求 AP，采用长度归一化 Token Logprob 作为排序置信度计算 AP50 与 AP@[.50:.95]"

hardware:
  local_environment: "NVIDIA GeForce RTX 4060 Laptop GPU (8GB VRAM), Local Dev & Inference"
  cloud_training_policy: "需用户明确授权具体规格（如 1x RTX 4090 24GB）、预算及时间上限"
