# Task Definition for Electronic-Component-Detection-with-Open-Source-VLMs
# Version: 3.0-semantic-verified
task_name: "Electronic-Component-Detection-with-Open-Source-VLMs"
thesis_title_zh: "基于开源视觉语言大模型的电子元器件检测"

task_definition:
  dataset_name: "Georgia Tech RIPL PCB WACV 2019"
  input_type: "已装配印刷电路板（PCB）高分辨率可见光图像"
  output_type: "电子元器件类别标签及水平矩形边界框像素坐标 [x1, y1, x2, y2]"
  splits_source: "annotations_v3_semantic/splits.json (historical baseline: annotations_v2_canonical/splits.json)"
  split_policy: "按物理PCB板卡严格划分（Train/Val/Test板卡完全互斥，零数据污染）"

canonical_categories:
  - id: 1
    name: "capacitor"
    zh: "电容"
  - id: 2
    name: "resistor"
    zh: "电阻"
  - id: 3
    name: "ic"
    zh: "集成电路芯片"
  - id: 4
    name: "connector"
    zh: "连接器/接插件"
  - id: 5
    name: "led"
    zh: "发光二极管"
  - id: 6
    name: "transistor"
    zh: "晶体管/三极管"
  - id: 7
    name: "diode"
    zh: "二极管"
  - id: 8
    name: "inductor"
    zh: "电感"
  - id: 9
    name: "button"
    zh: "按键"
  - id: 10
    name: "switch"
    zh: "开关"
  - id: 11
    name: "clock"
    zh: "晶振/时钟"

coordinate_protocol:
  canonical_unit: "像素绝对坐标 [x1, y1, x2, y2] (xmin, ymin, xmax, ymax)"
  qwen_vlm_protocol:
    format: "label <|box_start|>(xmin,ymin),(xmax,ymax)<|box_end|>"
    normalization: "[0, 1000] 归一化整型/浮点坐标"
    coordinate_order: "x-first: (xmin, ymin), (xmax, ymax)"
  deepseek_vlm_protocol:
    format: "label [ymin, xmin, ymax, xmax] (DeepSeek-VL-1.3B-chat numeric prompt contract; VL2 <|ref|>/<|det|> syntax rejected)"
    normalization: "[0, 1000] 归一化坐标"
    coordinate_order: "y-first: [ymin, xmin, ymax, xmax]"
    conversion: "统一经由 coordinate_protocol.parse_response(protocol='yxyx_norm1000') 转换为原图像素 xyxy"

models:
  primary_vlm:
    model_id: "Qwen/Qwen2-VL-2B-Instruct"
    architecture: "Qwen2-VL (ViT + Qwen2 LM)"
    local_snapshot: "models/models/Qwen--Qwen2-VL-2B-Instruct/snapshots/master"
    supported_roles: ["inference", "tiling", "lora_sft"]
  comparative_vlm:
    model_id: "deepseek-ai/deepseek-vl-1.3b-chat"
    architecture: "DeepSeek-VL (SigLIP-L + DeepSeek-LLM-1.3B)"
    local_snapshot: "models/models/deepseek-ai--deepseek-vl-1.3b-chat/snapshots/master"
    supported_roles: ["inference", "comparative_baseline"]

evaluation:
  primary_metrics:
    - "Official_COCO_AP50"
    - "Official_COCO_mAP50_95"
    - "Precision@IoU=0.50 (Micro & Macro)"
    - "Recall@IoU=0.50 (Micro & Macro)"
    - "F1@IoU=0.50"
    - "Parse_Success_Rate (分母为全部预期评估图片数)"
  secondary_metrics:
    - "Precision@IoU=0.75"
    - "Inference_Latency_ms"
    - "Peak_VRAM_MB (全过程峰值)"

hardware:
  local_environment: "NVIDIA GeForce RTX 4060 Laptop GPU (8GB VRAM), Local Dev & Inference"
  training_precision: "bfloat16"
