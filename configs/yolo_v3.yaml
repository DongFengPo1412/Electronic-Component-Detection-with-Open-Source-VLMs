version: yolo-v3-r7
model: yolo11n
pretrained_source: https://github.com/ultralytics/assets/releases/download/v8.3.0/yolo11n.pt
license: AGPL-3.0
training:
  epochs: 60
  patience: 12
  imgsz: 640
  batch: 8
  nbs: 16
  optimizer: AdamW
  lr0: 0.001
  lrf: 0.01
  momentum: 0.9
  weight_decay: 0.0005
  warmup_epochs: 3
  cos_lr: true
  amp: false
  seed: 42
  deterministic: true
  workers: 2
  device: 0
  cache: false
  mosaic: 0.0
  mixup: 0.0
  cutmix: 0.0
  copy_paste: 0.0
  degrees: 0.0
  translate: 0.0
  scale: 0.0
  shear: 0.0
  perspective: 0.0
  hsv_h: 0.015
  hsv_s: 0.2
  hsv_v: 0.2
  flipud: 0.5
  fliplr: 0.5
  close_mosaic: 0
  max_det: 1000
  iou: 0.5
  save: true
  save_period: 10
  plots: true
  multi_scale: false
  verbose: false
  rect: false
inference:
  imgsz: 640
  tile_size: 640
  overlap_ratio: 0.20
  primary_conf: 0.25
  ap_collection_conf: 0.001
  iou_nms: 0.50
  max_det_per_input: 3000
  maximum_detections_after_global_nms: null
bounds:
  training_wall_seconds: 5400
  max_training_attempts: 1
  smoke_batches: 3
  no_hyperparameter_search: true
